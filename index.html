<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
                <!-- aqui vai a imagem na CSS -->
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
                <form action="login.php" method="post">
                    <div class="campo">
                        <i class="material-icons">account_box</i>
                        <input type="email" name="email" id="iemail" autocomplete="email" required size="30" placeholder="seu email">
                        <label for="iemail">E-mail:</label>
                    </div>
                    <div class="campo">
                        <i class="material-icons">key</i>
                        <input type="password" name="senha" id="isenha" autocomplete="current-password" required minlength="8" maxlength="20" size="30" placeholder="sua senha">
                        <label for="isenha">Senha:</label>
                    </div>
                    <!-- <div> -->
                        <input type="submit" value="Login">
                        <a href="#" class="botao">Esqueci a Senha <i class="material-icons">mail</i></a>
                    <!-- </div> -->
                </form>
            </div>
        </section>
    </main>
</body>
</html>
